<!DOCTYPE html>
<html>
<head>
  <title>Icon Generator</title>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="output"></div>
  
  <script>
    // Generate icons at different sizes
    const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
    
    function generateIcon(size) {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      
      // Gradient background
      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, '#667eea');
      gradient.addColorStop(1, '#764ba2');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, size, size);
      
      // Draw QR code scanner icon
      ctx.strokeStyle = 'white';
      ctx.fillStyle = 'white';
      ctx.lineWidth = size * 0.08;
      
      const margin = size * 0.2;
      const innerSize = size - (margin * 2);
      
      // Corner brackets (QR scanner style)
      const cornerSize = innerSize * 0.3;
      
      // Top-left corner
      ctx.beginPath();
      ctx.moveTo(margin, margin + cornerSize);
      ctx.lineTo(margin, margin);
      ctx.lineTo(margin + cornerSize, margin);
      ctx.stroke();
      
      // Top-right corner
      ctx.beginPath();
      ctx.moveTo(size - margin - cornerSize, margin);
      ctx.lineTo(size - margin, margin);
      ctx.lineTo(size - margin, margin + cornerSize);
      ctx.stroke();
      
      // Bottom-left corner
      ctx.beginPath();
      ctx.moveTo(margin, size - margin - cornerSize);
      ctx.lineTo(margin, size - margin);
      ctx.lineTo(margin + cornerSize, size - margin);
      ctx.stroke();
      
      // Bottom-right corner
      ctx.beginPath();
      ctx.moveTo(size - margin - cornerSize, size - margin);
      ctx.lineTo(size - margin, size - margin);
      ctx.lineTo(size - margin, size - margin - cornerSize);
      ctx.stroke();
      
      // Center scan line
      ctx.fillRect(margin + size * 0.05, size / 2 - size * 0.02, innerSize - size * 0.1, size * 0.04);
      
      return canvas;
    }
    
    // Generate all icon sizes
    sizes.forEach(size => {
      const canvas = generateIcon(size);
      canvas.toBlob(blob => {
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.download = `icon-${size}.png`;
        link.href = url;
        link.textContent = `Download icon-${size}.png`;
        link.style.display = 'block';
        link.style.margin = '10px';
        document.getElementById('output').appendChild(link);
        
        const img = document.createElement('img');
        img.src = url;
        img.width = size;
        img.height = size;
        img.style.margin = '10px';
        document.getElementById('output').appendChild(img);
      });
    });
  </script>
</body>
</html>
